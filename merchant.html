<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" type="image/png" href="/tubiao.png">
    <title>山予海AI·商家中心</title>
  
    <style>
        body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; flex-direction: column; }
        .card { 
            background: white; border-radius: 24px; padding: 30px; max-width: 480px; width: 100%; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.08); position: relative; margin-bottom: 20px;
        }
        .merchant-id-badge {
            position: absolute; top: 18px; left: 20px;
            font-size: 13px; color: #0b4f6c; background: #e8f4fd;
            padding: 4px 14px; border-radius: 20px; font-weight: 500;
        }
        h2 { color: #0b4f6c; margin-bottom: 20px; padding-top: 5px; cursor: pointer; user-select: none; }
        input, textarea, select, button { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; }
        button { background: #1e90ff; color: white; border: none; cursor: pointer; font-weight: 600; border-radius: 50px; }
        .info { text-align: center; font-size: 18px; margin: 20px 0; }
        .recharge-tip { text-align: center; font-size: 13px; color: #888; margin-top: -10px; margin-bottom: 15px; }
        #qrImage { display: block; margin: 20px auto; max-width: 200px; }
        .hidden { display: none; }
        .open-link { color: #1e90ff; font-weight: 500; cursor: pointer; text-decoration: underline; }
        .btn-row { display: flex; gap: 10px; margin: 10px 0; }
        .btn-row button { flex: 1; padding: 10px; font-size: 14px; background: #3498db; }
        .btn-row .recharge-btn { background: #27ae60; }
        .btn-row .pricing-btn { background: #8e44ad; }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 999;
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: white; border-radius: 20px; padding: 25px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
        th, td { border-bottom: 1px solid #eee; padding: 8px 6px; text-align: left; }
        th { background: #f8fafc; }
        .style-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .style-item input { flex: 1; margin-bottom: 0; }
        .style-item button { width: auto; padding: 6px 15px; font-size: 14px; background: #e74c3c; }
        .collapse-icon { float: right; transition: transform 0.3s; }
        .collapsed .collapse-icon { transform: rotate(-90deg); }
        label { font-weight: 600; color: #1a3c4a; font-size: 14px; display: block; margin-bottom: 6px; }
    </style>
</head>
<body>
    <div id="loginBox" class="card">
        <h2>🔐 商家登录</h2>
        <input type="text" id="merchantId" placeholder="商家ID">
        <input type="password" id="password" placeholder="密码">
        <button onclick="login()">登录</button>
        <p style="margin-top:10px; font-size:13px; color:#888;">
            没有账号？<span class="open-link" onclick="openContact()">开通账号</span>
        </p>
        <p id="loginError" style="color:red;"></p>
    </div>

    <div id="dashboard" class="hidden" style="width:100%; max-width:500px;">
        <div class="card">
            <span class="merchant-id-badge" id="merchantIdDisplay"></span>
            <h2><img src="/logo-qr.png" style="height: 1em; vertical-align: middle; margin-right: 8px;">山予海商家中心</h2>
            <div class="info">剩余算力：<strong id="balanceSpan"></strong></div>
            <p class="recharge-tip">💡 充值算力请联系管理员</p>
            <div class="btn-row">
                <button onclick="showFlow('consume')">📊 算力明细</button>
                <button onclick="showFlow('recharge')" class="recharge-btn">💰 充值记录</button>
                <button onclick="showPricing()" class="pricing-btn">💎 算力价目</button>
            </div>
            <p style="margin-top:15px;">专属推广二维码（客人扫码生成好评，每次消耗2算力）</p>
            <!-- 二维码居中+logo叠加 -->
            <div style="position: relative; display: block; margin: 20px auto; text-align: center;">
                <img id="qrImage" style="display: block; margin: 0 auto;" />
                <img src="/logo.jpg" style="
                    position: absolute;
                    top: 50%; left: 50%;
                    transform: translate(-50%, -50%);
                    width: 40px; height: 40px;
                    border-radius: 8px;
                    box-shadow: 0 0 0 4px white;
                " />
            </div>
            <p style="text-align:center; color:#888; word-break:break-all;">链接: <span id="qrUrl"></span></p>
            <button onclick="refreshQR()">🔄 刷新二维码（旧码失效）</button>
            <button onclick="logout()" style="background:#ccc;color:#333;">退出登录</button>
        </div>

        <div class="card" id="settingsCard">
            <h2 onclick="toggleSettings()">🛠️ 店铺设置 <span class="collapse-icon">▼</span></h2>
            <div id="settingsPanel" style="display: none;">
                <label for="industryInput">行业（如：民宿、餐饮、美容）</label>
                <input type="text" id="industryInput" placeholder="例如：民宿">
                <label for="keywordsInput">关键词（多个用逗号分隔）</label>
                <input type="text" id="keywordsInput" placeholder="例如：海景,日出,赶海,包车">
                <label for="productInput">产品/服务名称</label>
                <input type="text" id="productInput" placeholder="例如：山予海民宿">
                <label for="locationInput">门店位置（详细地址）</label>
                <input type="text" id="locationInput" placeholder="例如：霞浦县三沙镇东壁村88号">
                <label for="extraNote">其他补充说明（可选）</label>
                <textarea id="extraNote" rows="3" placeholder="例如：我们的特色是..."></textarea>
                <p style="margin-top:15px; font-weight:600;">📝 快捷生成风格（可自定义）</p>
                <div id="styleList"></div>
                <div class="btn-row" style="margin-top:10px;">
                    <button onclick="addStyle()">➕ 添加快捷生成</button>
                    <button onclick="removeLastStyle()" style="background:#e74c3c;">🗑 删除最后一个</button>
                </div>
                <button onclick="saveSettings()">💾 保存全部设置</button>
                <p id="settingsMsg" style="text-align:center; color:green;"></p>
            </div>
        </div>

        <div class="card" id="passwordCard">
            <h2 onclick="togglePassword()">🔑 修改密码 <span class="collapse-icon">▼</span></h2>
            <div id="passwordPanel" style="display: none;">
                <input type="password" id="oldPassword" placeholder="当前密码">
                <input type="password" id="newPassword1" placeholder="新密码">
                <input type="password" id="newPassword2" placeholder="再次输入新密码">
                <button onclick="changePassword()">✅ 修改密码</button>
                <p id="changePwdMsg" style="text-align:center; color:green;"></p>
            </div>
        </div>
    </div>

    <!-- 联系管理员弹窗 -->
    <div id="contactModal" class="modal-overlay">
        <div class="modal-content">
            <h3>📞 联系管理员</h3>
            <div id="contactQrContainer"><img id="contactQrImage" src="" alt="管理员微信二维码" /></div>
            <div id="contactInfo" style="margin: 10px 0; font-size: 14px;"></div>
            <button onclick="document.getElementById('contactModal').style.display='none'" style="background:#ccc;color:#333;width:auto;margin-top:10px;">关闭</button>
        </div>
    </div>

    <!-- 流水弹窗 -->
    <div id="flowModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="flowTitle">流水明细</h3>
            <table>
                <thead><tr><th>时间</th><th>类型</th><th>变动</th><th>余额</th><th>备注</th></tr></thead>
                <tbody id="flowTableBody"></tbody>
            </table>
            <button onclick="document.getElementById('flowModal').style.display='none'" style="background:#ccc;color:#333;">关闭</button>
        </div>
    </div>

    <!-- 价目表弹窗 -->
    <div id="pricingModal" class="modal-overlay">
        <div class="modal-content">
            <h3>💎 算力价目表</h3>
            <table>
                <thead><tr><th>算力数量</th><th>价格</th></tr></thead>
                <tbody id="pricingTableBody"></tbody>
            </table>
            <p id="pricingNote" style="text-align:center; color:#888; margin-top:10px;"></p>
            <button onclick="document.getElementById('pricingModal').style.display='none'" style="background:#ccc;color:#333;">关闭</button>
        </div>
    </div>

    <script>
        const API_BASE = '/api/merchant';
        let currentStyles = [];

        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const autoToken = urlParams.get('auto_token');
            if (autoToken) {
                localStorage.setItem('merchant_token', autoToken);
                history.replaceState({}, '', '/merchant.html');
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                showDashboard();
                loadSettings();
                return;
            }
            if (localStorage.getItem('merchant_token')) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                showDashboard();
                loadSettings();
            } else {
                document.getElementById('loginBox').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden');
            }
        })();

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            document.getElementById('settingsCard').classList.toggle('collapsed');
        }

        function togglePassword() {
            const panel = document.getElementById('passwordPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            document.getElementById('passwordCard').classList.toggle('collapsed');
        }

        async function login() {
            const id = document.getElementById('merchantId').value.trim();
            const password = document.getElementById('password').value;
            const res = await fetch(`${API_BASE}/login`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, password })
            });
            const data = await res.json();
            if (data.token) {
                localStorage.setItem('merchant_token', data.token);
                localStorage.setItem('merchant_id', id);
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                showDashboard();
                loadSettings();
            } else {
                document.getElementById('loginError').innerText = data.error || '登录失败';
            }
        }

        async function showDashboard() {
            const token = localStorage.getItem('merchant_token');
            const id = localStorage.getItem('merchant_id');
            if (!token || !id) { logout(); return; }
            const res = await fetch(`${API_BASE}/info`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            if (data.id) {
                document.getElementById('merchantIdDisplay').innerText = `商家ID：${data.id}`;
                document.getElementById('balanceSpan').innerText = data.balance;
                const tokenVal = data.token_val || '';
                const url = `https://www.shanyh.top?merchant=${data.id}&token=${tokenVal}`;
                document.getElementById('qrUrl').innerText = url;
                document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
            } else {
                alert('登录已过期');
                logout();
            }
        }

        async function loadSettings() {
            const token = localStorage.getItem('merchant_token');
            const res = await fetch(`${API_BASE}/info`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            if (data.settings) {
                document.getElementById('industryInput').value = data.settings.industry || '';
                document.getElementById('keywordsInput').value = data.settings.keywords || '';
                document.getElementById('productInput').value = data.settings.product || '';
                document.getElementById('locationInput').value = data.settings.location || '';
                document.getElementById('extraNote').value = data.settings.extraNote || '';
                currentStyles = data.settings.styles || [];
                renderStyles();
            } else {
                currentStyles = [];
                renderStyles();
            }
        }

        function renderStyles() {
            const container = document.getElementById('styleList');
            container.innerHTML = '';
            currentStyles.forEach((style, index) => {
                const div = document.createElement('div');
                div.className = 'style-item';
                div.innerHTML = `<input type="text" value="${style}" onchange="updateStyle(${index}, this.value)" placeholder="风格名称"><button onclick="deleteStyle(${index})">删除</button>`;
                container.appendChild(div);
            });
        }

        function addStyle() { currentStyles.push(''); renderStyles(); }
        function removeLastStyle() { if (currentStyles.length > 0) { currentStyles.pop(); renderStyles(); } }
        function updateStyle(index, value) { currentStyles[index] = value.trim(); }
        function deleteStyle(index) { currentStyles.splice(index, 1); renderStyles(); }

        async function saveSettings() {
            const token = localStorage.getItem('merchant_token');
            const inputs = document.querySelectorAll('#styleList .style-item input');
            const styles = [];
            inputs.forEach(input => { const val = input.value.trim(); if (val) styles.push(val); });
            currentStyles = styles;
            renderStyles();

            const settings = {
                industry: document.getElementById('industryInput').value.trim(),
                keywords: document.getElementById('keywordsInput').value.trim(),
                product: document.getElementById('productInput').value.trim(),
                location: document.getElementById('locationInput').value.trim(),
                extraNote: document.getElementById('extraNote').value.trim(),
                styles
            };
            const res = await fetch(`${API_BASE}/save-settings`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(settings)
            });
            const data = await res.json();
            document.getElementById('settingsMsg').innerText = data.success ? '✅ 设置已保存' : '❌ 保存失败：' + (data.error || '未知错误');
        }

        async function changePassword() {
            const token = localStorage.getItem('merchant_token');
            const oldPwd = document.getElementById('oldPassword').value;
            const new1 = document.getElementById('newPassword1').value;
            const new2 = document.getElementById('newPassword2').value;
            if (!oldPwd || !new1 || !new2) return alert('请填写所有密码字段');
            if (new1 !== new2) return alert('两次输入的新密码不一致');
            const res = await fetch(`${API_BASE}/change-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ oldPassword: oldPwd, newPassword: new1 })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('changePwdMsg').innerText = '✅ 密码修改成功，请重新登录';
                setTimeout(logout, 2000);
            } else {
                document.getElementById('changePwdMsg').innerText = '❌ ' + (data.error || '修改失败');
            }
        }

        async function refreshQR() {
            const token = localStorage.getItem('merchant_token');
            const res = await fetch(`${API_BASE}/refresh`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            if (data.success) { alert('二维码已刷新，旧码立即失效'); showDashboard(); }
            else alert('刷新失败：' + data.error);
        }

        // ★ 修复后的 showFlow 函数：正确过滤充值与消耗记录
        async function showFlow(filterType) {
            const token = localStorage.getItem('merchant_token');
            const res = await fetch(`${API_BASE}/flow`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            const tbody = document.getElementById('flowTableBody');
            tbody.innerHTML = '';
            let filtered = [];
            if (filterType === 'recharge') {
                // 充值记录：包含管理员充值、初始赠送、旧版充值
                filtered = data.flows.filter(f => ['admin_add', 'recharge', 'initial'].includes(f.type));
            } else if (filterType === 'consume') {
                // 算力明细：包含生成消耗、管理员扣除
                filtered = data.flows.filter(f => ['consume', 'admin_subtract'].includes(f.type));
            } else {
                filtered = data.flows;
            }
            if (filtered.length === 0) { tbody.innerHTML = '<tr><td colspan="5">暂无记录</td></tr>'; }
            else {
                filtered.forEach(f => {
                    const time = new Date(f.time).toLocaleString('zh-CN');
                    const typeMap = { 
                        'consume': '🔻消耗', 
                        'recharge': '💰充值', 
                        'initial': '🆕初始',
                        'admin_add': '➕管理员添加',
                        'admin_subtract': '➖管理员扣除' 
                    };
                    const typeText = typeMap[f.type] || f.type;
                    const amount = (f.type === 'consume' || f.type === 'admin_subtract') ? `-${f.amount}` : `+${f.amount}`;
                    tbody.innerHTML += `<tr><td>${time}</td><td>${typeText}</td><td>${amount}</td><td>${f.balanceAfter}</td><td>${f.note || ''}</td></tr>`;
                });
            }
            document.getElementById('flowTitle').innerText = filterType === 'consume' ? '算力消耗明细' : (filterType === 'recharge' ? '充值记录' : '全部流水');
            document.getElementById('flowModal').style.display = 'flex';
        }

        async function showPricing() {
            const res = await fetch('/api/merchant/pricing');
            const data = await res.json();
            const tbody = document.getElementById('pricingTableBody');
            tbody.innerHTML = data.items.map(item => `<tr><td>${item.amount} 算力</td><td>${item.price}</td></tr>`).join('');
            document.getElementById('pricingNote').innerText = data.note || '';
            document.getElementById('pricingModal').style.display = 'flex';
        }

        function logout() { localStorage.removeItem('merchant_token'); localStorage.removeItem('merchant_id'); location.reload(); }

        async function openContact() {
            document.getElementById('contactModal').style.display = 'flex';
            const res = await fetch('/api/admin/contact');
            const data = await res.json();
            const qrImg = document.getElementById('contactQrImage');
            if (data.qrcode_url) { qrImg.src = data.qrcode_url; document.getElementById('contactQrContainer').style.display = ''; }
            else document.getElementById('contactQrContainer').style.display = 'none';
            let html = '';
            if (data.phone) html += `<p>📱 电话：${data.phone}</p>`;
            if (data.wechat) html += `<p>💬 微信：${data.wechat}</p>`;
            if (data.extra) html += `<p>${data.extra}</p>`;
            if (!html) html = '<p>暂无联系方式</p>';
            document.getElementById('contactInfo').innerHTML = html;
        }
    </script>
</body>
</html>
