<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山予海 · 商家后台</title>
    <style>
        body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { 
            background: white; border-radius: 24px; padding: 30px; max-width: 450px; width: 100%; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.08); position: relative; 
        }
        .merchant-id-badge {
            position: absolute; top: 18px; left: 20px;
            font-size: 13px; color: #0b4f6c; background: #e8f4fd;
            padding: 4px 14px; border-radius: 20px; font-weight: 500;
        }
        h2 { color: #0b4f6c; margin-bottom: 20px; padding-top: 5px; }
        input, button { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; }
        button { background: #1e90ff; color: white; border: none; cursor: pointer; font-weight: 600; border-radius: 50px; }
        .info { text-align: center; font-size: 18px; margin: 20px 0; }
        .recharge-tip { text-align: center; font-size: 13px; color: #888; margin-top: -10px; margin-bottom: 15px; }
        #qrImage { display: block; margin: 20px auto; max-width: 200px; }
        .hidden { display: none; }
        .open-link { color: #1e90ff; font-weight: 500; cursor: pointer; text-decoration: underline; }
        .btn-row { display: flex; gap: 10px; margin: 10px 0; }
        .btn-row button { flex: 1; padding: 10px; font-size: 14px; background: #3498db; }
        .btn-row .recharge-btn { background: #27ae60; }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 999;
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: white; border-radius: 20px; padding: 25px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
        th, td { border-bottom: 1px solid #eee; padding: 8px 6px; text-align: left; }
        th { background: #f8fafc; }
    </style>
</head>
<body>
    <!-- 登录框 -->
    <div id="loginBox" class="card">
        <h2>🔐 商家登录</h2>
        <input type="text" id="merchantId" placeholder="商家ID">
        <input type="password" id="password" placeholder="密码">
        <button onclick="login()">登录</button>
        <p style="margin-top:10px; font-size:13px; color:#888;">
            没有账号？<span class="open-link" onclick="openContact()">开通账号</span>
        </p>
        <p id="loginError" style="color:red;"></p>
    </div>

    <!-- 仪表盘 -->
    <div id="dashboard" class="card hidden">
        <!-- 左上角商家ID -->
        <span class="merchant-id-badge" id="merchantIdDisplay"></span>
        <h2>🌊 山予海商家中心</h2>
        <div class="info">🧮 剩余算力：<strong id="balanceSpan"></strong></div>
        <p class="recharge-tip">💡 充值算力请联系管理员</p>
        <div class="btn-row">
            <button onclick="showFlow('consume')">📊 算力明细</button>
            <button onclick="showFlow('recharge')" class="recharge-btn">💰 充值记录</button>
        </div>
        <p style="margin-top:15px;">专属推广二维码（客人扫码生成好评，每次消耗2算力）</p>
        <img id="qrImage" />
        <p style="text-align:center; color:#888; word-break:break-all;">链接: <span id="qrUrl"></span></p>
        <button onclick="refreshQR()">🔄 刷新二维码（旧码失效）</button>
        <button onclick="logout()" style="background:#ccc;color:#333;">退出登录</button>
    </div>

    <!-- 联系管理员弹窗 -->
    <div id="contactModal" class="modal-overlay">
        <div class="modal-content">
            <h3>📞 联系管理员</h3>
            <div id="contactQrContainer">
                <img id="contactQrImage" src="" alt="管理员微信二维码" />
            </div>
            <div id="contactInfo" style="margin: 10px 0; font-size: 14px;"></div>
            <button onclick="document.getElementById('contactModal').style.display='none'" style="background:#ccc;color:#333;width:auto;margin-top:10px;">关闭</button>
        </div>
    </div>

    <!-- 流水弹窗 -->
    <div id="flowModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="flowTitle">流水明细</h3>
            <table>
                <thead><tr><th>时间</th><th>类型</th><th>变动</th><th>余额</th><th>备注</th></tr></thead>
                <tbody id="flowTableBody"></tbody>
            </table>
            <button onclick="document.getElementById('flowModal').style.display='none'" style="background:#ccc;color:#333;">关闭</button>
        </div>
    </div>

    <script>
        const API_BASE = '/api/merchant';

        // 页面加载时，检查是否已登录
        (function() {
            if (localStorage.getItem('merchant_token')) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                showDashboard();
            } else {
                document.getElementById('loginBox').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden');
            }
        })();

        async function login() {
            const id = document.getElementById('merchantId').value.trim();
            const password = document.getElementById('password').value;
            const res = await fetch(`${API_BASE}/login`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, password })
            });
            const data = await res.json();
            if (data.token) {
                localStorage.setItem('merchant_token', data.token);
                localStorage.setItem('merchant_id', id);
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                showDashboard();
            } else {
                document.getElementById('loginError').innerText = data.error || '登录失败';
            }
        }

        async function showDashboard() {
            const token = localStorage.getItem('merchant_token');
            const id = localStorage.getItem('merchant_id');
            if (!token || !id) {
                logout();
                return;
            }
            const res = await fetch(`${API_BASE}/info`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.id) {
                document.getElementById('merchantIdDisplay').innerText = `商家ID：${data.id}`;
                document.getElementById('balanceSpan').innerText = data.balance;
                const tokenVal = data.token_val || '';
                const url = `https://www.shanyh.top?merchant=${data.id}&token=${tokenVal}`;
                document.getElementById('qrUrl').innerText = url;
                document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
            } else {
                alert('登录已过期');
                logout();
            }
        }

        async function refreshQR() {
            const token = localStorage.getItem('merchant_token');
            const res = await fetch(`${API_BASE}/refresh`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.success) {
                alert('二维码已刷新，旧码立即失效');
                showDashboard();
            } else {
                alert('刷新失败：' + data.error);
            }
        }

        async function showFlow(filterType) {
            const token = localStorage.getItem('merchant_token');
            const res = await fetch(`${API_BASE}/flow`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            const tbody = document.getElementById('flowTableBody');
            tbody.innerHTML = '';
            const filtered = filterType ? data.flows.filter(f => f.type === filterType) : data.flows;
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">暂无记录</td></tr>';
            } else {
                filtered.forEach(f => {
                    const time = new Date(f.time).toLocaleString('zh-CN');
                    const typeMap = { 
                        'consume': '🔻消耗', 
                        'recharge': '💰充值', 
                        'initial': '🆕初始',
                        'admin_add': '➕管理员添加',
                        'admin_subtract': '➖管理员扣除' 
                    };
                    const typeText = typeMap[f.type] || f.type;
                    const amount = (f.type === 'consume' || f.type === 'admin_subtract') ? `-${f.amount}` : `+${f.amount}`;
                    tbody.innerHTML += `<tr>
                        <td>${time}</td>
                        <td>${typeText}</td>
                        <td>${amount}</td>
                        <td>${f.balanceAfter}</td>
                        <td>${f.note || ''}</td>
                    </tr>`;
                });
            }
            document.getElementById('flowTitle').innerText = filterType === 'consume' ? '算力消耗明细' : (filterType === 'recharge' ? '充值记录' : '全部流水');
            document.getElementById('flowModal').style.display = 'flex';
        }

        function logout() {
            localStorage.removeItem('merchant_token');
            localStorage.removeItem('merchant_id');
            location.reload();
        }

        async function openContact() {
            document.getElementById('contactModal').style.display = 'flex';
            const res = await fetch('/api/admin/contact');
            const data = await res.json();
            const qrImg = document.getElementById('contactQrImage');
            if (data.qrcode_url) {
                qrImg.src = data.qrcode_url;
                document.getElementById('contactQrContainer').style.display = '';
            } else {
                document.getElementById('contactQrContainer').style.display = 'none';
            }
            let infoHtml = '';
            if (data.phone) infoHtml += `<p>📱 电话：${data.phone}</p>`;
            if (data.wechat) infoHtml += `<p>💬 微信：${data.wechat}</p>`;
            if (data.extra) infoHtml += `<p>${data.extra}</p>`;
            if (!infoHtml) infoHtml = '<p>暂无联系方式</p>';
            document.getElementById('contactInfo').innerHTML = infoHtml;
        }
    </script>
</body>
</html>
