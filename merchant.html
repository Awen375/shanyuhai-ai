<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山予海 · 商家后台</title>
    <style>
        body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: white; border-radius: 24px; padding: 30px; max-width: 420px; width: 100%; box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
        h2 { color: #0b4f6c; margin-bottom: 20px; }
        input, button { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; }
        button { background: #1e90ff; color: white; border: none; cursor: pointer; font-weight: 600; border-radius: 50px; }
        .info { text-align: center; font-size: 18px; margin: 20px 0; }
        #qrImage { display: block; margin: 20px auto; max-width: 200px; }
        .hidden { display: none; }
        .open-link { color: #1e90ff; font-weight: 500; cursor: pointer; text-decoration: underline; }

        /* 联系弹窗 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 999;
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: white; border-radius: 20px; padding: 25px; max-width: 380px; width: 90%; text-align: center;
        }
        .modal-content img { max-width: 200px; margin: 15px auto; }
    </style>
</head>
<body>
    <div id="loginBox" class="card">
        <h2>🔐 商家登录</h2>
        <input type="text" id="merchantId" placeholder="商家ID">
        <input type="password" id="password" placeholder="密码">
        <button onclick="login()">登录</button>
        <p style="margin-top:10px; font-size:13px; color:#888;">
            没有账号？<span class="open-link" onclick="openContact()">开通账号</span>
        </p>
        <p id="loginError" style="color:red;"></p>
    </div>

    <div id="dashboard" class="card hidden">
        <h2>🌊 山予海商家中心</h2>
        <div class="info">🧮 剩余算力：<strong id="balanceSpan"></strong></div>
        <p>专属推广二维码（客人扫码生成好评，每次消耗2算力）</p>
        <img id="qrImage" />
        <p style="text-align:center; color:#888; word-break:break-all;">链接: <span id="qrUrl"></span></p>
        <button onclick="logout()">退出登录</button>
    </div>

    <!-- 联系管理员弹窗 -->
    <div id="contactModal" class="modal-overlay">
        <div class="modal-content">
            <h3>📞 联系管理员</h3>
            <div id="contactQrContainer">
                <img id="contactQrImage" src="" alt="管理员微信二维码" />
            </div>
            <div id="contactInfo" style="margin: 10px 0; font-size: 14px;"></div>
            <button onclick="document.getElementById('contactModal').style.display='none'" style="background:#ccc;color:#333;width:auto;margin-top:10px;">关闭</button>
        </div>
    </div>

    <script>
        const API_BASE = '/api/merchant';

        async function login(){
            const id = document.getElementById('merchantId').value.trim();
            const password = document.getElementById('password').value;
            const res = await fetch(`${API_BASE}/login`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ id, password })
            });
            const data = await res.json();
            if(data.token) {
                localStorage.setItem('merchant_token', data.token);
                localStorage.setItem('merchant_id', id);
                showDashboard();
            } else {
                document.getElementById('loginError').innerText = data.error || '登录失败';
            }
        }

        async function showDashboard(){
            const token = localStorage.getItem('merchant_token');
            const id = localStorage.getItem('merchant_id');
            const res = await fetch(`${API_BASE}/info`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if(data.id) {
                document.getElementById('balanceSpan').innerText = data.balance;
                const url = `https://www.shanyh.top?merchant=${data.id}`;
                document.getElementById('qrUrl').innerText = url;
                document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
            } else {
                alert('登录已过期，请重新登录');
                logout();
            }
        }

        function logout(){
            localStorage.removeItem('merchant_token');
            localStorage.removeItem('merchant_id');
            location.reload();
        }

        // 打开联系弹窗，从 API 获取信息
        async function openContact(){
            const modal = document.getElementById('contactModal');
            modal.style.display = 'flex';
            try {
                const res = await fetch('/api/admin/contact');
                const data = await res.json();
                // 微信二维码
                const qrImg = document.getElementById('contactQrImage');
                if(data.qrcode_url) {
                    qrImg.src = data.qrcode_url;
                    document.getElementById('contactQrContainer').style.display = '';
                } else {
                    document.getElementById('contactQrContainer').style.display = 'none';
                }
                // 文字联系方式
                let infoHtml = '';
                if(data.phone) infoHtml += `<p>📱 电话：${data.phone}</p>`;
                if(data.wechat) infoHtml += `<p>💬 微信：${data.wechat}</p>`;
                if(data.extra) infoHtml += `<p>${data.extra}</p>`;
                if(!infoHtml) infoHtml = '<p>暂无联系方式，请稍后再试</p>';
                document.getElementById('contactInfo').innerHTML = infoHtml;
            } catch(e) {
                document.getElementById('contactInfo').innerHTML = '<p>获取联系方式失败</p>';
            }
        }

        if(localStorage.getItem('merchant_token')) {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            showDashboard();
        }
    </script>
</body>
</html>
