<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山予海 · 商家后台</title>
    <style>
        body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; flex-direction: column; }
        .card { 
            background: white; border-radius: 24px; padding: 30px; max-width: 480px; width: 100%; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.08); position: relative; margin-bottom: 20px;
        }
        .merchant-id-badge {
            position: absolute; top: 18px; left: 20px;
            font-size: 13px; color: #0b4f6c; background: #e8f4fd;
            padding: 4px 14px; border-radius: 20px; font-weight: 500;
        }
        h2 { color: #0b4f6c; margin-bottom: 20px; padding-top: 5px; cursor: pointer; user-select: none; }
        input, textarea, select, button { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; }
        button { background: #1e90ff; color: white; border: none; cursor: pointer; font-weight: 600; border-radius: 50px; }
        .info { text-align: center; font-size: 18px; margin: 20px 0; }
        .recharge-tip { text-align: center; font-size: 13px; color: #888; margin-top: -10px; margin-bottom: 15px; }
        #qrImage { display: block; margin: 20px auto; max-width: 200px; }
        .hidden { display: none; }
        .open-link { color: #1e90ff; font-weight: 500; cursor: pointer; text-decoration: underline; }
        .btn-row { display: flex; gap: 10px; margin: 10px 0; }
        .btn-row button { flex: 1; padding: 10px; font-size: 14px; background: #3498db; }
        .btn-row .recharge-btn { background: #27ae60; }
        .btn-row .pricing-btn { background: #8e44ad; }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 999;
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: white; border-radius: 20px; padding: 25px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
        th, td { border-bottom: 1px solid #eee; padding: 8px 6px; text-align: left; }
        th { background: #f8fafc; }
        .style-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .style-item input { flex: 1; margin-bottom: 0; }
        .style-item button { width: auto; padding: 6px 15px; font-size: 14px; background: #e74c3c; }
        .collapse-icon { float: right; transition: transform 0.3s; }
        .collapsed .collapse-icon { transform: rotate(-90deg); }
        label { font-weight: 600; color: #1a3c4a; font-size: 14px; display: block; margin-bottom: 6px; }
    </style>
</head>
<body>
    <div id="loginBox" class="card">
        <h2>🔐 商家登录</h2>
        <input type="text" id="merchantId" placeholder="商家ID">
        <input type="password" id="password" placeholder="密码">
        <button onclick="login()">登录</button>
        <p style="margin-top:10px; font-size:13px; color:#888;">
            没有账号？<span class="open-link" onclick="openContact()">开通账号</span>
        </p>
        <p id="loginError" style="color:red;"></p>
    </div>

    <div id="dashboard" class="hidden" style="width:100%; max-width:500px;">
        <div class="card">
            <span class="merchant-id-badge" id="merchantIdDisplay"></span>
            <h2>🌊 山予海商家中心</h2>
            <div class="info">🧮 剩余算力：<strong id="balanceSpan"></strong></div>
            <p class="recharge-tip">💡 充值算力请联系管理员</p>
            <div class="btn-row">
                <button onclick="showFlow('consume')">📊 算力明细</button>
                <button onclick="showFlow('recharge')" class="recharge-btn">💰 充值记录</button>
                <button onclick="showPricing()" class="pricing-btn">💎 算力价目</button>
            </div>
            <p style="margin-top:15px;">专属推广二维码（客人扫码生成好评，每次消耗2算力）</p>
            <img id="qrImage" />
            <p style="text-align:center; color:#888; word-break:break-all;">链接: <span id="qrUrl"></span></p>
            <button onclick="refreshQR()">🔄 刷新二维码（旧码失效）</button>
            <button onclick="logout()" style="background:#ccc;color:#333;">退出登录</button>
        </div>

        <div class="card" id="settingsCard">
            <h2 onclick="toggleSettings()">🛠️ 店铺设置 <span class="collapse-icon">▼</span></h2>
            <div id="settingsPanel" style="display: none;">
                <label for="industryInput">行业（如：民宿、餐饮、美容）</label>
                <input type="text" id="industryInput" placeholder="例如：民宿">
                <label for="keywordsInput">关键词（多个用逗号分隔）</label>
                <input type="text" id="keywordsInput" placeholder="例如：海景,日出,赶海,包车">
                <label for="productInput">产品/服务名称</label>
                <input type="text" id="productInput" placeholder="例如：山予海民宿">
                <label for="extraNote">其他补充说明（可选）</label>
                <textarea id="extraNote" rows="3" placeholder="例如：我们的特色是..."></textarea>
                <p style="margin-top:15px; font-weight:600;">📝 快捷生成风格（可自定义）</p>
                <div id="styleList"></div>
                <div class="btn-row" style="margin-top:10px;">
                    <button onclick="addStyle()">➕ 添加快捷生成</button>
                    <button onclick="removeLastStyle()" style="background:#e74c3c;">🗑 删除最后一个</button>
                </div>
                <button onclick="saveSettings()">💾 保存全部设置</button>
                <p id="settingsMsg" style="text-align:center; color:green;"></p>
            </div>
        </div>

        <!-- 修改密码卡片（默认折叠） -->
        <div class="card" id="passwordCard">
            <h2 onclick="togglePassword()">🔑 修改密码 <span class="collapse-icon">▼</span></h2>
            <div id="passwordPanel" style="display: none;">
                <input type="password" id="oldPassword" placeholder="当前密码">
                <input type="password" id="newPassword1" placeholder="新密码">
                <input type="password" id="newPassword2" placeholder="再次输入新密码">
                <button onclick="changePassword()">✅ 修改密码</button>
                <p id="changePwdMsg" style="text-align:center; color:green;"></p>
            </div>
        </div>
    </div>

    <!-- 弹窗代码保持不变，此处省略以节省篇幅，请从之前完整版复制 -->
    <!-- 请确保包含：联系管理员、流水、价目表弹窗，以及完整的 JavaScript 逻辑 -->
    <!-- 由于篇幅限制，此处不贴出全部弹窗和脚本，但你需要将之前 merchant.html 中除了“修改密码卡片”外的所有内容保留，并将修改密码卡片替换为上述折叠版本 -->
</body>
</html>
