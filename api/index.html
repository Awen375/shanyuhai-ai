<html>
<head>
    <meta charset="UTF-8">

</head>
<body style="max-width:500px;margin:50px auto;font-family:sans-serif">
    <h2>✍️ 输入你的要求</h2>
    <textarea id="prompt" rows="3" placeholder="例如：霞浦邂逅 | 藏在东壁村的「此时此刻」💕

和朋友一起出行，简直不要太欢乐

在「此时此刻」，邂逅属于你的美好时光~" style="width:100%"></textarea>
    <br>
    <button onclick="generate()">生成文案</button>
    <div id="result" style="margin-top:20px;background:#f5f5f5;padding:15px;white-space:pre-wrap;"></div>
    <script>
        async function generate() {
            const p = document.getElementById('prompt').value;
            if(!p) return alert('请输入要求');
            document.getElementById('result').innerText = '正在生成...';
            const res = await fetch('/api/generate', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({prompt: p})
            });
            const data = await res.json();
            document.getElementById('result').innerText = data.result || data.error;
        }
    </script>
</body>
</html>
