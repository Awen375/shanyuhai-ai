<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山予海AI · 文案助手</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(165deg, #e8f4f8 0%, #d4eaf3 30%, #b8dff0 60%, #a3d2e0 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 20px; position: relative; overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; bottom: 0; left: 0; width: 100%; height: 200px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 200"><path fill="%23ffffff30" d="M0,100 C240,150 480,50 720,100 C960,150 1200,50 1440,100 L1440,200 L0,200 Z"/></svg>') repeat-x;
            background-size: 1440px 200px; animation: wave 20s linear infinite; pointer-events: none; z-index: 0;
        }
        @keyframes wave { 0% { transform: translateX(0); } 100% { transform: translateX(-1440px); } }
        .scan-reminder {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; color: #1e3b4a; z-index: 2; position: relative; padding: 20px;
        }
        .scan-reminder h2 { font-size: 26px; margin-bottom: 15px; color: #0b4f6c; user-select: none; cursor: pointer; }
        .scan-reminder p { color: #5a7d8c; margin: 10px 0; font-size: 15px; }
        .scan-buttons { margin-top: 25px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .scan-btn {
            background: rgba(255,255,255,0.7); backdrop-filter: blur(10px);
            padding: 12px 25px; border-radius: 50px; color: #0b4f6c; text-decoration: none;
            font-size: 15px; font-weight: 500; border: 1px solid rgba(30,144,255,0.3); transition: all 0.3s; display: inline-block; cursor: pointer;
        }
        .scan-btn:hover { background: rgba(30,144,255,0.15); border-color: rgba(30,144,255,0.5); }
        .container {
            position: relative; z-index: 1; background: rgba(255,255,255,0.8); backdrop-filter: blur(20px);
            border-radius: 32px; box-shadow: 0 25px 50px rgba(15,76,129,0.15), 0 0 0 1px rgba(255,255,255,0.6) inset;
            padding: 35px; max-width: 550px; width: 100%; border: 1px solid rgba(255,255,255,0.5);
        }
        .merchant-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 8px 16px;
            background: rgba(255,255,255,0.6); border-radius: 20px; font-size: 14px; color: #0b4f6c;
        }
        .header { text-align: center; margin-bottom: 25px; }
        .logo-icon { font-size: 58px; margin-bottom: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-8px); } }
        h1 {
            font-size: 32px; font-weight: 700; background: linear-gradient(135deg, #0b4f6c, #1e8bc3);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 8px; letter-spacing: 1px; user-select: none; cursor: pointer;
        }
        .subtitle { color: #5a7d8c; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .subtitle span { background: rgba(30,144,255,0.15); padding: 2px 10px; border-radius: 20px; font-size: 13px; color: #0f4c81; }
        .form-group { margin-bottom: 22px; }
        label { display: flex; align-items: center; gap: 6px; font-weight: 600; color: #1a3c4a; margin-bottom: 8px; font-size: 14px; }
        label i { font-style: normal; font-size: 18px; }
        select, textarea {
            width: 100%; padding: 14px 18px; border: 2px solid rgba(30,144,255,0.2); border-radius: 18px;
            font-size: 15px; outline: none; transition: all 0.3s; font-family: inherit;
            background: rgba(255,255,255,0.7); backdrop-filter: blur(5px); color: #2c3e50; appearance: none;
        }
        select {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%231e90ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
            background-repeat: no-repeat; background-position: right 18px center; background-size: 18px; cursor: pointer;
        }
        textarea { height: 90px; resize: vertical; background-image: none; }
        select:focus, textarea:focus { border-color: #1e90ff; background: rgba(255,255,255,0.95); box-shadow: 0 0 0 5px rgba(30,144,255,0.15); }
        button {
            width: 100%; background: linear-gradient(135deg, #0b4f6c 0%, #1e90ff 100%); color: white; border: none;
            padding: 16px; font-size: 18px; font-weight: 600; border-radius: 50px; cursor: pointer;
            margin: 10px 0 20px; transition: all 0.3s; box-shadow: 0 10px 25px rgba(15,76,129,0.35);
            letter-spacing: 1px; position: relative; overflow: hidden;
        }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        .result-box {
            background: rgba(255,255,255,0.75); backdrop-filter: blur(10px); border-radius: 20px;
            padding: 22px; text-align: left; min-height: 80px; color: #1e3b4a; line-height: 1.8;
            white-space: pre-wrap; word-break: break-word; border-left: 5px solid #1e90ff;
            display: none; font-size: 15px; border: 1px solid rgba(30,144,255,0.2);
        }
        .result-box.show { display: block; animation: fadeInUp 0.5s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .footer { text-align: center; margin-top: 25px; font-size: 12px; color: #6b8e9e; font-weight: 300; letter-spacing: 0.5px; }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(6px); z-index: 999; align-items: center; justify-content: center;
        }
        .modal-box { background: white; border-radius: 24px; padding: 30px; text-align: center; max-width: 360px; width: 90%; }
        .modal-box input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 12px; margin: 15px 0; font-size: 16px; }
        .modal-box button { width: auto; margin: 5px; }
        .modal-box img { max-width: 200px; margin: 10px auto; }
        .emoji-check { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 14px; color: #1a3c4a; }
        .emoji-check input { width: 18px; height: 18px; }
        @media (max-width: 480px) {
            .container { padding: 25px 20px; border-radius: 28px; }
            h1 { font-size: 26px; }
            .logo-icon { font-size: 48px; }
        }
    </style>
</head>
<body>

    <div id="noMerchant" class="scan-reminder">
<img src="/logo.png" alt="logo" class="logo-icon" style="width: 80px; height: auto;" />
        <h2 id="scanTitle">山予海AI文案助手</h2>
        <p>请扫描商家提供的专属二维码使用</p>
        <p style="color: #888; font-size: 14px;">如有疑问，请联系山予海AI技术团队</p>
        <div class="scan-buttons">
            <a href="/merchant.html" class="scan-btn">商家登录</a>
            <span class="scan-btn" onclick="openContact()">联系管理员</span>
        </div>
    </div>

    <div id="mainApp" style="display: none; width: 100%;">
        <div class="container">
            <div class="merchant-bar">
                <span>商家：<strong id="displayMerchantId"></strong></span>
                <button onclick="exitMerchant()" style="width:auto; padding:6px 16px; background:#ccc; color:#333; border:none; border-radius:20px; cursor:pointer; font-size:13px;">退出</button>
            </div>
            <div class="header">
<img src="/logo.png" alt="logo" class="logo-icon" style="width: 80px; height: auto;" />
                <h1 id="mainTitle">山予海AI文案助手</h1>
                <div class="subtitle"><span>✨ AI好评助手</span><span>山予海AI大模型</span></div>
            </div>
            <div class="form-group">
                <label for="platformSelect"><i>📱</i> 选择平台</label>
                <select id="platformSelect">
                    <option value="xiaohongshu">📕 小红书文案</option>
                    <option value="dianping">⭐ 大众点评</option>
                    <option value="douyin">🎵 抖音</option>
                </select>
            </div>
            <!-- 新增表情勾选框 -->
            <div class="emoji-check">
                <input type="checkbox" id="useEmojiCheck" checked>
                <label for="useEmojiCheck">在文案中添加表情符号 (emoji)</label>
            </div>
            <div class="form-group">
                <label for="styleSelect"><i>✍️</i> 选择写作风格</label>
                <select id="styleSelect"></select>
            </div>
            <div class="form-group">
                <label for="prompt"><i>💬</i> 额外补充（可选）</label>
                <textarea id="prompt" placeholder="例如：强调海景日出、步行到海滩3分钟、亲子房..."></textarea>
            </div>
            <button id="generateBtn" onclick="generate()">生成好评</button>
            <div id="result" class="result-box"></div>
            <div class="footer">本程序由，山予海AI大模型团队提供技术支持。</div>
        </div>
    </div>

    <div id="adminModal" class="modal-overlay">
        <div class="modal-box">
            <h3>🔐 管理员验证</h3>
            <input type="password" id="adminPassInput" placeholder="请输入后台密码">
            <button onclick="checkAdminPass()">进入后台</button>
            <button onclick="closeAdminModal()" style="background:#ccc;color:#333;">取消</button>
        </div>
    </div>

    <div id="contactModal" class="modal-overlay">
        <div class="modal-box">
            <h3>📞 联系管理员</h3>
            <div id="contactQrContainer"><img id="contactQrImage" src="" alt="管理员微信二维码" /></div>
            <div id="contactInfo" style="margin: 10px 0; font-size: 14px;"></div>
            <button onclick="document.getElementById('contactModal').style.display='none'" style="background:#ccc;color:#333;">关闭</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const merchantId = urlParams.get('merchant');
        const tokenVal = urlParams.get('token') || '';

        const defaultStyles = ["情绪共鸣型", "宝藏发现型", "氛围描绘型", "干货整理型", "攻略型"];

        function setDefaultStyles() {
            document.getElementById('styleSelect').innerHTML = defaultStyles.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        async function loadStyles(merchant) {
            try {
                const res = await fetch(`/api/merchant/styles?merchant=${merchant}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.styles && data.styles.length > 0) {
                        document.getElementById('styleSelect').innerHTML = data.styles.map(s => `<option value="${s}">${s}</option>`).join('');
                        return;
                    }
                }
            } catch(e) {}
            setDefaultStyles();
        }

        if (merchantId) {
            localStorage.setItem('current_merchant', merchantId);
            if (tokenVal) localStorage.setItem('current_token', tokenVal);
            document.getElementById('displayMerchantId').innerText = merchantId;
            document.getElementById('noMerchant').style.display = 'none';
            document.getElementById('mainApp').style.display = '';
            loadStyles(merchantId);
        } else {
            const savedMerchant = localStorage.getItem('current_merchant');
            if (savedMerchant) {
                document.getElementById('displayMerchantId').innerText = savedMerchant;
                document.getElementById('noMerchant').style.display = 'none';
                document.getElementById('mainApp').style.display = '';
                loadStyles(savedMerchant);
            } else {
                document.getElementById('noMerchant').style.display = '';
                document.getElementById('mainApp').style.display = 'none';
                setDefaultStyles();
            }
        }

        function exitMerchant() {
            localStorage.removeItem('current_merchant');
            localStorage.removeItem('current_token');
            location.href = '/';
        }

        function setupSecretTrigger(elId) {
            const el = document.getElementById(elId);
            if (!el) return;
            let count = 0, timer = null;
            el.addEventListener('click', () => {
                count++;
                if (count === 1) timer = setTimeout(() => { count = 0; }, 3000);
                if (count >= 10) {
                    clearTimeout(timer); count = 0;
                    document.getElementById('adminModal').style.display = 'flex';
                }
            });
        }
        setupSecretTrigger('scanTitle');
        setupSecretTrigger('mainTitle');

        function checkAdminPass() {
            if (document.getElementById('adminPassInput').value === 'zjm1314520') {
                window.location.href = '/admin.html';
            } else {
                alert('密码错误');
            }
        }
        function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }

        async function openContact() {
            document.getElementById('contactModal').style.display = 'flex';
            try {
                const res = await fetch('/api/admin/contact');
                const data = await res.json();
                const qrImg = document.getElementById('contactQrImage');
                if (data.qrcode_url) {
                    qrImg.src = data.qrcode_url;
                    document.getElementById('contactQrContainer').style.display = '';
                } else {
                    document.getElementById('contactQrContainer').style.display = 'none';
                }
                let html = '';
                if (data.phone) html += `<p>📱 电话：${data.phone}</p>`;
                if (data.wechat) html += `<p>💬 微信：${data.wechat}</p>`;
                if (data.extra) html += `<p>${data.extra}</p>`;
                if (!html) html = '<p>暂无联系方式</p>';
                document.getElementById('contactInfo').innerHTML = html;
            } catch(e) {
                document.getElementById('contactInfo').innerHTML = '<p>获取联系方式失败</p>';
            }
        }

        async function generate() {
            const btn = document.getElementById('generateBtn');
            const platform = document.getElementById('platformSelect').value;
            const useEmoji = document.getElementById('useEmojiCheck').checked;
            const style = document.getElementById('styleSelect').value;
            const prompt = document.getElementById('prompt').value.trim();
            const resultBox = document.getElementById('result');
            btn.disabled = true;
            btn.innerText = '⏳ 正在生成中...';
            resultBox.classList.add('show');
            resultBox.innerText = '⏳ 山予海正在为您书写...';
            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        platform,
                        useEmoji,
                        style,
                        prompt,
                        merchant: localStorage.getItem('current_merchant') || '',
                        token: localStorage.getItem('current_token') || ''
                    })
                });
                const data = await res.json();
                if (data.result) {
                    resultBox.innerText = data.result;
                } else {
                    throw new Error(data.error || '生成失败');
                }
            } catch(err) {
                resultBox.innerText = '❌ ' + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = '生成好评';
            }
        }
    </script>
</body>
</html>
