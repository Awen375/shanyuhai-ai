<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山予海民宿 · 好评助手</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(160deg, #fde2c3 0%, #f8c291 25%, #f5a57a 50%, #e07a5f 75%, #c75b3a 100%);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 夕阳余晖光晕 */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 235, 200, 0.5) 0%, rgba(255,180,120,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 250, 245, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 40px;
            box-shadow: 0 30px 50px rgba(120, 50, 20, 0.25), inset 0 0 0 1px rgba(255,255,255,0.7);
            padding: 45px 30px;
            max-width: 530px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-frame {
            display: inline-block;
            background: rgba(255,255,255,0.5);
            padding: 12px 24px;
            border-radius: 60px;
            margin-bottom: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .logo-icon {
            font-size: 36px;
            line-height: 1;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.1));
        }

        h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 34px;
            font-weight: 700;
            color: #5c2e1a;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }

        .divider {
            width: 40px;
            height: 3px;
            background: #d68a6b;
            margin: 0 auto 14px;
            border-radius: 2px;
        }

        .subtitle {
            color: #7a4a38;
            font-size: 14px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #4e301f;
            margin-bottom: 8px;
            font-size: 14px;
            letter-spacing: 0.4px;
            padding-left: 4px;
        }

        select, textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(200, 140, 110, 0.4);
            border-radius: 20px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(5px);
            color: #3e2a22;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23c75b3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
            background-repeat: no-repeat;
            background-position: right 18px center;
        }
        select {
            cursor: pointer;
        }
        textarea {
            height: 90px;
            resize: vertical;
            background-image: none;
        }
        select:focus, textarea:focus {
            border-color: #c75b3a;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 5px rgba(200, 120, 80, 0.2);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #c75b3a 0%, #e08e6a 100%);
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin: 8px 0 20px;
            transition: all 0.3s;
            box-shadow: 0 12px 25px rgba(180, 80, 40, 0.35);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            font-family: 'Noto Serif SC', serif;
        }
        button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,240,220,0.4) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 35px rgba(180, 80, 40, 0.5);
        }
        button:hover::after {
            opacity: 1;
        }
        button:active {
            transform: translateY(0);
        }

        .result-box {
            background: rgba(255, 248, 240, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 22px;
            padding: 22px;
            text-align: left;
            min-height: 80px;
            color: #3e2a22;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
            border-left: 5px solid #c75b3a;
            display: none;
            font-size: 15px;
            border: 1px solid rgba(200,120,80,0.2);
        }
        .result-box.show {
            display: block;
            animation: fadeInUp 0.5s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: #9b6e5a;
            font-weight: 300;
            letter-spacing: 0.5px;
            font-style: italic;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 22px;
                border-radius: 34px;
            }
            h1 {
                font-size: 28px;
            }
            .logo-icon {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-frame">
                <span class="logo-icon">🏡🌅</span>
            </div>
            <h1>山予海民宿</h1>
            <div class="divider"></div>
            <div class="subtitle">用日落般的温柔，写一条好評</div>
        </div>

        <div class="form-group">
            <label>✍️ 写作风格</label>
            <select id="styleSelect">
                <option value="情绪共鸣型">🌇 情绪共鸣型 · 余晖般的感动</option>
                <option value="宝藏发现型">✨ 宝藏发现型 · 秘密基地</option>
                <option value="氛围描绘型">🕯️ 氛围描绘型 · 烛光海风</option>
                <option value="干货整理型">📝 干货整理型 · 贴心指南</option>
                <option value="攻略型">🗺️ 攻略型 · 漫游霞浦</option>
            </select>
        </div>

        <div class="form-group">
            <label>💬 补充细节（可选）</label>
            <textarea id="prompt" placeholder="例如：顶楼露台看夕阳、管家准备的晚安茶..."></textarea>
        </div>

        <button onclick="generate()">🌊 生成山予海好评</button>

        <div id="result" class="result-box"></div>
        <div class="footer">山予海 · 让每一次停留都有回响</div>
    </div>

    <script>
        async function generate() {
            const style = document.getElementById('styleSelect').value;
            const prompt = document.getElementById('prompt').value.trim();
            const resultBox = document.getElementById('result');

            resultBox.classList.add('show');
            resultBox.innerText = '⏳ 海风正在传递你的文字...';
            resultBox.style.color = '#3e2a22';

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, style })
                });
                const data = await res.json();
                if (data.result) {
                    resultBox.innerText = data.result;
                } else {
                    throw new Error(data.error || '生成失败');
                }
            } catch (err) {
                resultBox.innerText = '❌ ' + err.message;
                resultBox.style.color = '#b83b2e';
            }
        }
    </script>

</body>
</html>
