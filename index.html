<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山予海民宿 · AI好评助手</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(165deg, #e8f4f8 0%, #d4eaf3 30%, #b8dff0 60%, #a3d2e0 100%);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 200"><path fill="%23ffffff30" d="M0,100 C240,150 480,50 720,100 C960,150 1200,50 1440,100 L1440,200 L0,200 Z"></path></svg>') repeat-x;
            background-size: 1440px 200px;
            animation: wave 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes wave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-1440px); }
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            box-shadow: 0 25px 50px rgba(15, 76, 129, 0.15), 0 0 0 1px rgba(255,255,255,0.6) inset;
            padding: 45px 35px;
            max-width: 550px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .header { text-align: center; margin-bottom: 35px; }

        .logo-icon {
            font-size: 58px; margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 32px; font-weight: 700;
            background: linear-gradient(135deg, #0b4f6c, #1e8bc3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px; letter-spacing: 1px;
            cursor: pointer; user-select: none;
        }

        .subtitle {
            color: #5a7d8c; font-size: 15px; font-weight: 400;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .subtitle span {
            background: rgba(30, 144, 255, 0.15);
            padding: 2px 10px; border-radius: 20px;
            font-size: 13px; color: #0f4c81;
        }

        .form-group { margin-bottom: 22px; }
        label {
            display: flex; align-items: center; gap: 6px;
            font-weight: 600; color: #1a3c4a;
            margin-bottom: 8px; font-size: 14px; letter-spacing: 0.5px;
        }
        label i { font-style: normal; font-size: 18px; }

        select, textarea {
            width: 100%; padding: 14px 18px;
            border: 2px solid rgba(30, 144, 255, 0.2);
            border-radius: 18px; font-size: 15px;
            outline: none; transition: all 0.3s;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(5px);
            color: #2c3e50;
            appearance: none;
        }
        select {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%231e90ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
            background-repeat: no-repeat;
            background-position: right 18px center;
            background-size: 18px;
            cursor: pointer;
        }
        textarea { height: 90px; resize: vertical; background-image: none; }
        select:focus, textarea:focus {
            border-color: #1e90ff;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 5px rgba(30, 144, 255, 0.15);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #0b4f6c 0%, #1e90ff 100%);
            color: white; border: none;
            padding: 16px; font-size: 18px; font-weight: 600;
            border-radius: 50px; cursor: pointer;
            margin: 10px 0 20px;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(15, 76, 129, 0.35);
            letter-spacing: 1px; position: relative; overflow: hidden;
        }
        button:disabled {
            opacity: 0.7; cursor: not-allowed;
            transform: none; box-shadow: 0 5px 15px rgba(15, 76, 129, 0.2);
        }
        button::after {
            content: '';
            position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.3s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(15, 76, 129, 0.45);
        }
        button:hover:not(:disabled)::after { opacity: 1; }
        button:active:not(:disabled) { transform: translateY(0); }

        .result-box {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 20px; padding: 22px;
            text-align: left; min-height: 80px;
            color: #1e3b4a; line-height: 1.8;
            white-space: pre-wrap; word-break: break-word;
            border-left: 5px solid #1e90ff;
            display: none; font-size: 15px;
            border: 1px solid rgba(30,144,255,0.2);
        }
        .result-box.show { display: block; animation: fadeInUp 0.5s ease; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer {
            text-align: center; margin-top: 25px;
            font-size: 12px; color: #6b8e9e;
            font-weight: 300; letter-spacing: 0.5px;
        }

        /* 隐藏后台模态框 */
        .modal-overlay {
            display: none;
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            z-index: 999;
            align-items: center; justify-content: center;
        }
        .modal-box {
            background: white; border-radius: 24px;
            padding: 30px; text-align: center;
            max-width: 320px; width: 90%;
        }
        .modal-box input {
            width: 100%; padding: 12px;
            border: 2px solid #e0e0e0; border-radius: 12px;
            margin: 15px 0; font-size: 16px;
        }
        .modal-box button {
            width: auto; margin: 5px;
        }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; border-radius: 28px; }
            h1 { font-size: 26px; }
            .logo-icon { font-size: 48px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-icon">🌊</div>
            <h1 id="secretTrigger">山予海民宿</h1>
            <div class="subtitle">
                ✨ AI好评助手
                <span>霞浦·山予海</span>
            </div>
        </div>

        <div class="form-group">
            <label><i>✍️</i> 选择写作风格</label>
            <select id="styleSelect">
                <option value="情绪共鸣型">💙 情绪共鸣型 · 让客人心动</option>
                <option value="宝藏发现型">💎 宝藏发现型 · 挖到宝的惊喜</option>
                <option value="氛围描绘型">🌅 氛围描绘型 · 沉浸式体验</option>
                <option value="干货整理型">📋 干货整理型 · 实用信息清单</option>
                <option value="攻略型">🗺️ 攻略型 · 完整游玩攻略</option>
            </select>
        </div>

        <div class="form-group">
            <label><i>💬</i> 额外补充（可选）</label>
            <textarea id="prompt" placeholder="例如：强调海景日出、步行到海滩3分钟、亲子房..."></textarea>
        </div>

        <button id="generateBtn" onclick="generate()">🌊 生成民宿好评</button>

        <div id="result" class="result-box"></div>
        <div class="footer">🌿 每一条好评，都是山海的回响</div>
    </div>

    <!-- 隐藏后台验证弹窗 -->
    <div id="adminModal" class="modal-overlay">
        <div class="modal-box">
            <h3>🔐 管理员验证</h3>
            <input type="password" id="adminPassInput" placeholder="请输入后台密码">
            <button onclick="checkAdminPass()">进入后台</button>
            <button onclick="closeAdminModal()" style="background:#ccc;color:#333;">取消</button>
        </div>
    </div>

    <script>
        // ========== 隐藏后台入口（点击标题5次）==========
        const trigger = document.getElementById('secretTrigger');
        let clickCount = 0;
        let clickTimer = null;
        trigger.addEventListener('click', () => {
            clickCount++;
            if (clickCount === 1) {
                clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
            }
            if (clickCount >= 5) {
                clearTimeout(clickTimer);
                clickCount = 0;
                document.getElementById('adminModal').style.display = 'flex';
            }
        });

        function checkAdminPass() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === 'zjm1314520') {
                window.open('/admin.html', '_self');
            } else {
                alert('密码错误');
            }
        }
        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        // ========== 生成文案 ==========
        async function generate() {
            const btn = document.getElementById('generateBtn');
            const style = document.getElementById('styleSelect').value;
            const prompt = document.getElementById('prompt').value.trim();
            const resultBox = document.getElementById('result');

            btn.disabled = true;
            btn.innerText = '⏳ 正在生成中...';

            resultBox.classList.add('show');
            resultBox.innerText = '⏳ 山予海正在为您书写...';
            resultBox.style.color = '#1e3b4a';

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, style })
                });
                const data = await res.json();
                if (data.result) {
                    resultBox.innerText = data.result;
                } else {
                    throw new Error(data.error || '生成失败');
                }
            } catch (err) {
                resultBox.innerText = '❌ ' + err.message;
                resultBox.style.color = '#c44536';
            } finally {
                btn.disabled = false;
                btn.innerText = '🌊 生成民宿好评';
            }
        }
    </script>
</body>
</html>
