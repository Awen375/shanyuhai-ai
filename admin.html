<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>山予海 · 后台管理</title>
    <style>
        body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background: #f0f4f8; padding: 30px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { border-bottom: 1px solid #eee; padding: 10px 6px; text-align: left; }
        th { background: #f8fafc; }
        button { padding: 8px 18px; background: #1e90ff; color: white; border: none; border-radius: 20px; cursor: pointer; margin-right: 8px; }
        .hidden { display: none; }
        #loginBox { max-width: 350px; margin: 100px auto; }
    </style>
</head>
<body>
    <div id="loginBox" class="card">
        <h2>🔐 管理员登录</h2>
        <input type="password" id="password" placeholder="输入管理密码" style="width:100%;margin-bottom:10px;">
        <button onclick="login()">登录</button>
        <p id="loginError" style="color:red;"></p>
    </div>

    <div id="mainPanel" class="container hidden">
        <h1 style="color:#0b4f6c;">🌊 山予海后台</h1>
        <button onclick="logout()" style="background:#ccc;color:#333;margin-bottom:20px;">退出</button>
        <div class="card">
            <h2>📋 最近使用记录 <button onclick="loadRecords()" style="float:right;">🔄 刷新</button></h2>
            <table id="recordsTable">
                <thead><tr><th>时间</th><th>IP</th><th>风格</th><th>补充要点</th></tr></thead>
                <tbody id="recordsBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'zjm1314520';
        function login() {
            if (document.getElementById('password').value === ADMIN_PASSWORD) {
                localStorage.setItem('admin_token', ADMIN_PASSWORD);
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('mainPanel').classList.remove('hidden');
                loadRecords();
            } else {
                document.getElementById('loginError').innerText = '密码错误';
            }
        }
        function logout() { localStorage.removeItem('admin_token'); location.reload(); }
        if (localStorage.getItem('admin_token') === ADMIN_PASSWORD) {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('mainPanel').classList.remove('hidden');
            loadRecords();
        }

        async function loadRecords() {
            const tbody = document.getElementById('recordsBody');
            tbody.innerHTML = '<tr><td colspan="4">加载中...</td></tr>';
            try {
                const res = await fetch('/api/admin', {
                    headers: { 'x-admin-token': localStorage.getItem('admin_token') }
                });
                if (!res.ok) {
                    const errText = await res.text();
                    tbody.innerHTML = `<tr><td colspan="4">错误: ${errText}</td></tr>`;
                    return;
                }
                const data = await res.json();
                tbody.innerHTML = '';
                if (!data.records || data.records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">暂无记录</td></tr>';
                    return;
                }
                data.records.forEach(r => {
                    const time = new Date(r.time).toLocaleString('zh-CN');
                    const row = document.createElement('tr');
                    row.innerHTML = `<td>${time}</td><td>${r.ip}</td><td>${r.style}</td><td>${r.prompt}</td>`;
                    tbody.appendChild(row);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4">请求失败: ${err.message}</td></tr>`;
            }
        }
    </script>
</body>
</html>
