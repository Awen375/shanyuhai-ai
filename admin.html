<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>山予海 · 超级后台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background: #f0f4f8; padding: 30px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { color: #0b4f6c; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { border-bottom: 1px solid #eee; padding: 10px 6px; text-align: left; }
        th { background: #f8fafc; }
        input, button, select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        button { background: #1e90ff; color: white; border: none; cursor: pointer; border-radius: 20px; padding: 8px 18px; margin-right: 6px; margin-bottom: 6px; }
        button.danger { background: #e74c3c; }
        button.warning { background: #f39c12; }
        button.success { background: #27ae60; }
        button.info { background: #3498db; }
        .flex-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
        .label { font-weight: 600; min-width: 80px; }
        .hidden { display: none; }
        #loginBox { max-width: 350px; margin: 100px auto; }
        .stat-box { background: #f0f8ff; border-radius: 12px; padding: 15px; margin: 15px 0; }
        /* 模态框 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 999;
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: white; border-radius: 20px; padding: 25px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="loginBox" class="card">
        <h2>🔐 管理员登录</h2>
        <input type="password" id="password" placeholder="输入超级密码" style="width:100%;margin-bottom:10px;">
        <button onclick="login()">登录</button>
        <p id="loginError" style="color:red;"></p>
    </div>

    <div id="mainPanel" class="container hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <h1>🌊 山予海超级后台</h1>
            <button onclick="logout()" style="background:#ccc;color:#333;">退出</button>
        </div>

        <!-- 商家管理 -->
        <div class="card">
            <h2>🏪 商家管理</h2>
            <div class="flex-row">
                <input type="text" id="newMerchantId" placeholder="商家ID（手机号）">
                <input type="text" id="newMerchantName" placeholder="商家名称">
                <input type="password" id="newMerchantPass" placeholder="密码">
                <input type="number" id="newMerchantBalance" placeholder="初始算力" value="100" style="width:100px;">
                <button onclick="addMerchant()">新增商家</button>
            </div>
            <table id="merchantTable">
                <thead><tr><th>ID</th><th>名称</th><th>算力</th><th>状态</th><th>操作</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- 联系方式设置 -->
        <div class="card">
            <h2>📞 联系方式设置（商家页面弹窗）</h2>
            <div class="flex-row">
                <span class="label">微信二维码URL：</span>
                <input type="text" id="contactQrcode" placeholder="https://example.com/qr.jpg" style="width:300px;">
            </div>
            <div class="flex-row">
                <span class="label">管理员电话：</span>
                <input type="text" id="contactPhone" placeholder="13800138000" style="width:200px;">
            </div>
            <div class="flex-row">
                <span class="label">管理员微信：</span>
                <input type="text" id="contactWechat" placeholder="shanyuhai_kefu" style="width:200px;">
            </div>
            <div class="flex-row">
                <span class="label">其他说明：</span>
                <input type="text" id="contactExtra" placeholder="工作时间 9:00-21:00" style="width:300px;">
            </div>
            <button onclick="saveContact()">💾 保存联系方式</button>
        </div>

        <!-- 商家使用统计查询 -->
        <div class="card">
            <h2>📊 商家使用统计</h2>
            <div class="flex-row">
                <span class="label">选择商家：</span>
                <select id="statMerchantSelect">
                    <option value="">-- 请先选择商家 --</option>
                </select>
                <span class="label">开始日期：</span>
                <input type="date" id="statStart">
                <span class="label">结束日期：</span>
                <input type="date" id="statEnd">
                <button onclick="queryStats()">查询</button>
            </div>
            <div id="statResult" class="stat-box">请选择商家和日期范围后查询</div>
        </div>

        <!-- 使用记录总览 -->
        <div class="card">
            <h2>📋 最近使用记录 <button onclick="loadRecords()" style="float:right;">🔄 刷新</button></h2>
            <table id="recordsTable">
                <thead><tr><th>时间</th><th>IP</th><th>商家</th><th>风格</th><th>补充</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- 流水弹窗 -->
    <div id="flowModal" class="modal-overlay">
        <div class="modal-content">
            <h3>🧮 算力流水 <span id="flowMerchantName"></span></h3>
            <table>
                <thead><tr><th>时间</th><th>类型</th><th>变动</th><th>变动后算力</th><th>备注</th></tr></thead>
                <tbody id="flowTableBody"></tbody>
            </table>
            <button onclick="document.getElementById('flowModal').style.display='none'" style="background:#ccc;color:#333;">关闭</button>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'zjm1314520';
        const token = () => localStorage.getItem('admin_token');

        function login(){
            if(document.getElementById('password').value === ADMIN_PASSWORD) {
                localStorage.setItem('admin_token', ADMIN_PASSWORD);
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('mainPanel').classList.remove('hidden');
                loadAll();
            } else {
                document.getElementById('loginError').innerText = '密码错误';
            }
        }
        function logout(){ localStorage.removeItem('admin_token'); location.reload(); }

        if(token() === ADMIN_PASSWORD) {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('mainPanel').classList.remove('hidden');
            loadAll();
        }

        async function loadAll() {
            await loadMerchants();
            await loadRecords();
            await loadContact();
        }

        // ===== 商家列表 =====
        async function loadMerchants(){
            const res = await fetch('/api/admin/merchants', { headers: { 'x-admin-token': token() } });
            const data = await res.json();
            const tbody = document.querySelector('#merchantTable tbody');
            tbody.innerHTML = '';
            const statSelect = document.getElementById('statMerchantSelect');
            statSelect.innerHTML = '<option value="">-- 选择商家 --</option>';

            data.merchants.forEach(m => {
                const statusText = m.status === 'banned' ? '🚫已封' : '✅正常';
                tbody.innerHTML += `<tr>
                    <td>${m.id}</td>
                    <td>${m.name || ''}</td>
                    <td>${m.balance}</td>
                    <td>${statusText}</td>
                    <td>
                        <button onclick="rechargeMerchant('${m.id}')">💰充值</button>
                        <button onclick="showFlow('${m.id}')" class="info">📈流水</button>
                        <button onclick="deleteMerchant('${m.id}')" class="danger">🗑删除</button>
                        ${m.status === 'banned' 
                            ? `<button onclick="toggleBan('${m.id}', false)" class="success">🔓解封</button>`
                            : `<button onclick="toggleBan('${m.id}', true)" class="warning">🚫封号</button>`
                        }
                    </td>
                </tr>`;
                statSelect.innerHTML += `<option value="${m.id}">${m.id} - ${m.name||''}</option>`;
            });
        }

        async function addMerchant(){
            const id = document.getElementById('newMerchantId').value.trim();
            const name = document.getElementById('newMerchantName').value.trim();
            const password = document.getElementById('newMerchantPass').value;
            const balance = parseInt(document.getElementById('newMerchantBalance').value) || 100;
            if(!id || !password) return alert('ID和密码必填');
            await fetch('/api/admin/merchants', {
                method: 'POST',
                headers: { 'Content-Type':'application/json', 'x-admin-token': token() },
                body: JSON.stringify({ id, name, password, balance })
            });
            await loadMerchants();
        }

        async function rechargeMerchant(id){
            const newBalance = prompt('输入新的算力余额（将覆盖当前余额）：');
            if(newBalance !== null && !isNaN(newBalance)) {
                await fetch('/api/admin/merchants', {
                    method: 'PUT',
                    headers: { 'Content-Type':'application/json', 'x-admin-token': token() },
                    body: JSON.stringify({ id, balance: parseInt(newBalance) })
                });
                await loadMerchants();
            }
        }

        async function deleteMerchant(id){
            if(!confirm('确定删除商家 ' + id + '？此操作不可恢复。')) return;
            await fetch('/api/admin/merchants', {
                method: 'DELETE',
                headers: { 'Content-Type':'application/json', 'x-admin-token': token() },
                body: JSON.stringify({ id })
            });
            await loadMerchants();
        }

        async function toggleBan(id, ban){
            const action = ban ? '封号' : '解封';
            if(!confirm(`确定${action}商家 ${id} 吗？`)) return;
            await fetch('/api/admin/merchants', {
                method: 'PUT',
                headers: { 'Content-Type':'application/json', 'x-admin-token': token() },
                body: JSON.stringify({ id, status: ban ? 'banned' : 'active' })
            });
            await loadMerchants();
        }

        // ===== 流水 =====
        async function showFlow(merchantId){
            const res = await fetch(`/api/admin/merchants?action=flow&merchant=${merchantId}`, {
                headers: { 'x-admin-token': token() }
            });
            const data = await res.json();
            document.getElementById('flowMerchantName').innerText = merchantId;
            const tbody = document.getElementById('flowTableBody');
            tbody.innerHTML = '';
            if(!data.flows || data.flows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">暂无流水</td></tr>';
            } else {
                data.flows.forEach(f => {
                    const time = new Date(f.time).toLocaleString('zh-CN');
                    const typeMap = { 'consume': '🔻消耗', 'recharge': '💰充值', 'initial': '🆕初始' };
                    const typeText = typeMap[f.type] || f.type;
                    const amount = f.type === 'consume' ? `-${f.amount}` : `+${f.amount}`;
                    tbody.innerHTML += `<tr>
                        <td>${time}</td>
                        <td>${typeText}</td>
                        <td>${amount}</td>
                        <td>${f.balanceAfter}</td>
                        <td>${f.note || ''}</td>
                    </tr>`;
                });
            }
            document.getElementById('flowModal').style.display = 'flex';
        }

        // ===== 统计 =====
        async function queryStats(){
            const merchantId = document.getElementById('statMerchantSelect').value;
            if(!merchantId) return alert('请选择商家');
            const start = document.getElementById('statStart').value;
            const end = document.getElementById('statEnd').value;
            if(!start || !end) return alert('请选择起止日期');

            const res = await fetch(`/api/admin/merchants?action=stats&merchant=${merchantId}&start=${start}&end=${end}`, {
                headers: { 'x-admin-token': token() }
            });
            const data = await res.json();
            if(res.ok) {
                let html = `<p>📅 <b>${start} ~ ${end}</b></p><p>🧮 总生成次数：<b>${data.total}</b></p>`;
                if(Object.keys(data.daily||{}).length > 0) {
                    html += '<h4>每日明细：</h4><table><tr><th>日期</th><th>次数</th></tr>';
                    Object.entries(data.daily).forEach(([date,count]) => {
                        html += `<tr><td>${date}</td><td>${count}</td></tr>`;
                    });
                    html += '</table>';
                }
                document.getElementById('statResult').innerHTML = html;
            } else {
                document.getElementById('statResult').innerText = '查询失败：' + data.error;
            }
        }

        // ===== 全部日志 =====
        async function loadRecords(){
            const tbody = document.querySelector('#recordsTable tbody');
            tbody.innerHTML = '<tr><td colspan="5">加载中...</td></tr>';
            const res = await fetch('/api/admin', { headers: { 'x-admin-token': token() } });
            const data = await res.json();
            if(!res.ok) { tbody.innerHTML = `<tr><td colspan="5">错误: ${data.error}</td></tr>`; return; }
            tbody.innerHTML = '';
            if(data.records.length === 0) { tbody.innerHTML = '<tr><td colspan="5">暂无记录</td></tr>'; return; }
            data.records.forEach(r => {
                const time = new Date(r.time).toLocaleString('zh-CN');
                tbody.innerHTML += `<tr><td>${time}</td><td>${r.ip||''}</td><td>${r.merchant||'无'}</td><td>${r.style}</td><td>${r.prompt||''}</td></tr>`;
            });
        }

        // ===== 联系方式 =====
        async function loadContact(){
            const res = await fetch('/api/admin/contact');
            const data = await res.json();
            document.getElementById('contactQrcode').value = data.qrcode_url || '';
            document.getElementById('contactPhone').value = data.phone || '';
            document.getElementById('contactWechat').value = data.wechat || '';
            document.getElementById('contactExtra').value = data.extra || '';
        }

        async function saveContact(){
            const qrcode_url = document.getElementById('contactQrcode').value.trim();
            const phone = document.getElementById('contactPhone').value.trim();
            const wechat = document.getElementById('contactWechat').value.trim();
            const extra = document.getElementById('contactExtra').value.trim();
            await fetch('/api/admin/contact', {
                method: 'POST',
                headers: { 'Content-Type':'application/json', 'x-admin-token': token() },
                body: JSON.stringify({ qrcode_url, phone, wechat, extra })
            });
            alert('联系方式已保存');
        }
    </script>
</body>
</html>
