<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>山予海 · 超级后台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background: #f0f4f8; padding: 30px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { color: #0b4f6c; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { border-bottom: 1px solid #eee; padding: 10px 6px; text-align: left; }
        th { background: #f8fafc; }
        input, button { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        button { background: #1e90ff; color: white; border: none; cursor: pointer; border-radius: 20px; padding: 8px 18px; margin-right: 8px; }
        button.danger { background: #e74c3c; }
        .flex-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
        .label { font-weight: 600; min-width: 80px; }
        .ip-list { max-height: 200px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 12px; padding: 10px; margin-top: 10px; }
        .ip-tag { display: inline-block; background: #e8f4fd; padding: 4px 12px; border-radius: 20px; margin: 3px; font-size: 13px; }
        .ip-tag button { background: none; border: none; color: #c0392b; cursor: pointer; padding: 0 4px; font-size: 16px; }
        .hidden { display: none; }
        #loginBox { max-width: 350px; margin: 100px auto; }
    </style>
</head>
<body>
    <div id="loginBox" class="card">
        <h2>🔐 管理员登录</h2>
        <input type="password" id="password" placeholder="输入超级密码" style="width:100%;margin-bottom:10px;">
        <button onclick="login()">登录</button>
        <p id="loginError" style="color:red;"></p>
    </div>

    <div id="mainPanel" class="container hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <h1>🌊 山予海超级后台</h1>
            <button onclick="logout()" style="background:#ccc;color:#333;">退出</button>
        </div>

        <!-- 商家管理 -->
        <div class="card">
            <h2>🏪 商家管理</h2>
            <div class="flex-row">
                <input type="text" id="newMerchantId" placeholder="商家ID（手机号）">
                <input type="text" id="newMerchantName" placeholder="商家名称">
                <input type="password" id="newMerchantPass" placeholder="密码">
                <input type="number" id="newMerchantBalance" placeholder="初始算力" value="100" style="width:100px;">
                <button onclick="addMerchant()">新增商家</button>
            </div>
            <table id="merchantTable">
                <thead><tr><th>ID</th><th>名称</th><th>算力</th><th>操作</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- 限流/封禁设置 -->
        <div class="card">
            <h2>⚙️ 生成限制设置</h2>
            <div class="flex-row">
                <span class="label">每日默认次数：</span>
                <input type="number" id="defaultLimit" min="1" style="width:80px;">
                <button onclick="saveConfig()">💾 保存设置</button>
            </div>
            <div style="margin-top:15px;">
                <strong>🚫 禁用IP列表</strong>
                <div id="bannedList" class="ip-list"></div>
                <div class="flex-row">
                    <input type="text" id="banIpInput" placeholder="输入要禁用的IP">
                    <button onclick="addBanIP()">禁用此IP</button>
                </div>
            </div>
            <div style="margin-top:15px;">
                <strong>🌟 不限制IP（白名单）</strong>
                <div id="unlimitedList" class="ip-list"></div>
                <div class="flex-row">
                    <input type="text" id="unlimitIpInput" placeholder="输入不限IP">
                    <button onclick="addUnlimitedIP()">添加白名单</button>
                </div>
            </div>
            <div style="margin-top:15px;">
                <strong>🔢 自定义IP限额</strong>
                <div id="customLimitList" class="ip-list"></div>
                <div class="flex-row">
                    <input type="text" id="customIpInput" placeholder="IP">
                    <input type="number" id="customLimitValue" placeholder="次数" min="1" style="width:70px;">
                    <button onclick="setCustomLimit()">设置</button>
                </div>
            </div>
        </div>

        <!-- 使用记录 -->
        <div class="card">
            <h2>📋 最近使用记录 <button onclick="loadRecords()" style="float:right;">🔄 刷新</button></h2>
            <table id="recordsTable">
                <thead><tr><th>时间</th><th>IP</th><th>商家</th><th>风格</th><th>补充</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'shanyuhai2024'; // ⚠️ 改成你自己的密码
        let currentConfig = { rateConfig:{ defaultLimit:5, unlimitedIPs:[], customLimits:{} }, banned:[] };

        function login(){
            if(document.getElementById('password').value === ADMIN_PASSWORD) {
                localStorage.setItem('admin_token', ADMIN_PASSWORD);
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('mainPanel').classList.remove('hidden');
                loadAll();
            } else {
                document.getElementById('loginError').innerText = '密码错误';
            }
        }
        function logout(){ localStorage.removeItem('admin_token'); location.reload(); }

        const token = () => localStorage.getItem('admin_token');
        if(token() === ADMIN_PASSWORD) {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('mainPanel').classList.remove('hidden');
            loadAll();
        }

        async function loadAll(){ await loadConfig(); await loadMerchants(); await loadRecords(); }

        // ===== 商家管理 =====
        async function loadMerchants(){
            const res = await fetch('/api/admin/merchants', { headers: {'x-admin-token': token()} });
            const data = await res.json();
            const tbody = document.querySelector('#merchantTable tbody');
            tbody.innerHTML = '';
            data.merchants.forEach(m => {
                tbody.innerHTML += `<tr>
                    <td>${m.id}</td><td>${m.name}</td><td>${m.balance}</td>
                    <td>
                        <button onclick="updateMerchant('${m.id}')">更新</button>
                        <button class="danger" onclick="deleteMerchant('${m.id}')">删除</button>
                    </td>
                </tr>`;
            });
        }
        async function addMerchant(){
            const id = document.getElementById('newMerchantId').value.trim();
            const name = document.getElementById('newMerchantName').value.trim();
            const password = document.getElementById('newMerchantPass').value;
            const balance = parseInt(document.getElementById('newMerchantBalance').value) || 100;
            await fetch('/api/admin/merchants', {
                method: 'POST',
                headers: { 'Content-Type':'application/json', 'x-admin-token': token() },
                body: JSON.stringify({ id, name, password, balance })
            });
            loadMerchants();
        }
        async function updateMerchant(id){
            const newBalance = prompt('输入新算力余额：');
            if(newBalance !== null) {
                await fetch('/api/admin/merchants', {
                    method: 'PUT',
                    headers: { 'Content-Type':'application/json', 'x-admin-token': token() },
                    body: JSON.stringify({ id, balance: parseInt(newBalance) })
                });
                loadMerchants();
            }
        }
        async function deleteMerchant(id){
            if(confirm('确定删除商家 ' + id + '？')) {
                await fetch('/api/admin/merchants', {
                    method: 'DELETE',
                    headers: { 'Content-Type':'application/json', 'x-admin-token': token() },
                    body: JSON.stringify({ id })
                });
                loadMerchants();
            }
        }

        // ===== 配置管理 =====
        async function loadConfig(){
            const res = await fetch('/api/admin/config', { headers: {'x-admin-token': token()} });
            const data = await res.json();
            currentConfig = data;
            document.getElementById('defaultLimit').value = data.rateConfig.defaultLimit;
            renderIPLists(data.rateConfig, data.banned);
        }
        function renderIPLists(rateConfig, banned){
            document.getElementById('bannedList').innerHTML = banned.length ? banned.map(ip=>`<span class="ip-tag">${ip} <button onclick="removeBanIP('${ip}')">×</button></span>`).join('') : '（无）';
            document.getElementById('unlimitedList').innerHTML = rateConfig.unlimitedIPs.length ? rateConfig.unlimitedIPs.map(ip=>`<span class="ip-tag">${ip} <button onclick="removeUnlimitedIP('${ip}')">×</button></span>`).join('') : '（无）';
            const custom = Object.entries(rateConfig.customLimits||{}).map(([ip,limit])=>`<span class="ip-tag">${ip} (${limit}次) <button onclick="removeCustomLimit('${ip}')">×</button></span>`).join('');
            document.getElementById('customLimitList').innerHTML = custom || '（无）';
        }
        async function saveConfig(){
            currentConfig.rateConfig.defaultLimit = parseInt(document.getElementById('defaultLimit').value);
            await fetch('/api/admin/config', {
                method: 'POST',
                headers: { 'Content-Type':'application/json', 'x-admin-token': token() },
                body: JSON.stringify(currentConfig)
            });
            alert('设置已保存');
        }
        async function addBanIP(){
            const ip = document.getElementById('banIpInput').value.trim();
            if(ip && !currentConfig.banned.includes(ip)) { currentConfig.banned.push(ip); await saveConfig(); renderIPLists(currentConfig.rateConfig, currentConfig.banned); }
            document.getElementById('banIpInput').value = '';
        }
        async function removeBanIP(ip){ currentConfig.banned = currentConfig.banned.filter(i=>i!==ip); await saveConfig(); renderIPLists(currentConfig.rateConfig, currentConfig.banned); }
        async function addUnlimitedIP(){
            const ip = document.getElementById('unlimitIpInput').value.trim();
            if(ip && !currentConfig.rateConfig.unlimitedIPs.includes(ip)) { currentConfig.rateConfig.unlimitedIPs.push(ip); await saveConfig(); renderIPLists(currentConfig.rateConfig, currentConfig.banned); }
            document.getElementById('unlimitIpInput').value = '';
        }
        async function removeUnlimitedIP(ip){ currentConfig.rateConfig.unlimitedIPs = currentConfig.rateConfig.unlimitedIPs.filter(i=>i!==ip); await saveConfig(); renderIPLists(currentConfig.rateConfig, currentConfig.banned); }
        async function setCustomLimit(){
            const ip = document.getElementById('customIpInput').value.trim();
            const limit = parseInt(document.getElementById('customLimitValue').value);
            if(ip && limit>0) { currentConfig.rateConfig.customLimits[ip] = limit; await saveConfig(); renderIPLists(currentConfig.rateConfig, currentConfig.banned); }
        }
        async function removeCustomLimit(ip){ delete currentConfig.rateConfig.customLimits[ip]; await saveConfig(); renderIPLists(currentConfig.rateConfig, currentConfig.banned); }

        // ===== 使用记录 =====
        async function loadRecords(){
            const tbody = document.querySelector('#recordsTable tbody');
            tbody.innerHTML = '<tr><td colspan="5">加载中...</td></tr>';
            const res = await fetch('/api/admin', { headers: {'x-admin-token': token()} });
            const data = await res.json();
            if(!res.ok) { tbody.innerHTML = `<tr><td colspan="5">错误: ${data.error}</td></tr>`; return; }
            tbody.innerHTML = '';
            if(data.records.length===0) { tbody.innerHTML = '<tr><td colspan="5">暂无记录</td></tr>'; return; }
            data.records.forEach(r => {
                const time = new Date(r.time).toLocaleString('zh-CN');
                tbody.innerHTML += `<tr><td>${time}</td><td>${r.ip||''}</td><td>${r.merchant||'无'}</td><td>${r.style}</td><td>${r.prompt||''}</td></tr>`;
            });
        }
    </script>
</body>
</html>
