<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>山予海 · 超级后台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background: #f0f4f8; padding: 30px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { color: #0b4f6c; margin-top: 0; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { border-bottom: 1px solid #eee; padding: 10px 6px; text-align: left; }
        th { background: #f8fafc; }
        input, button, select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        button { background: #1e90ff; color: white; border: none; cursor: pointer; border-radius: 20px; padding: 8px 18px; margin-right: 6px; margin-bottom: 6px; }
        button.danger { background: #e74c3c; }
        button.warning { background: #f39c12; }
        button.success { background: #27ae60; }
        button.info { background: #3498db; }
        .flex-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
        .label { font-weight: 600; min-width: 80px; }
        .hidden { display: none; }
        #loginBox { max-width: 350px; margin: 100px auto; }
        .stat-box { background: #f0f8ff; border-radius: 12px; padding: 15px; margin: 15px 0; }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 999;
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: white; border-radius: 20px; padding: 25px; max-width: 550px; width: 90%; max-height: 80vh; overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="loginBox" class="card">
        <h2>🔐 管理员登录</h2>
        <input type="password" id="password" placeholder="输入超级密码" style="width:100%;margin-bottom:10px;">
        <button onclick="login()">登录</button>
        <p id="loginError" style="color:red;"></p>
    </div>

    <div id="mainPanel" class="container hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <h1>🌊 山予海超级后台</h1>
            <button onclick="logout()" style="background:#ccc;color:#333;">退出</button>
        </div>

        <!-- 商家管理 -->
        <div class="card">
            <h2>🏪 商家管理</h2>
            <div class="flex-row">
                <input type="text" id="newMerchantId" placeholder="商家ID">
                <input type="text" id="newMerchantName" placeholder="名称">
                <input type="password" id="newMerchantPass" placeholder="密码">
                <input type="number" id="newMerchantBalance" placeholder="初始算力" value="100" style="width:100px;">
                <button onclick="addMerchant()">新增</button>
            </div>
            <table id="merchantTable">
                <thead><tr><th>ID</th><th>名称</th><th>算力</th><th>状态</th><th>操作</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- 联系方式设置（折叠） -->
        <div class="card">
            <h2 onclick="toggleContact()">📞 联系方式设置（点击展开/折叠）</h2>
            <div id="contactPanel" style="display:none;">
                <div class="flex-row"><span class="label">微信二维码URL：</span><input type="text" id="contactQrcode" style="width:300px;"></div>
                <div class="flex-row"><span class="label">管理员电话：</span><input type="text" id="contactPhone" style="width:200px;"></div>
                <div class="flex-row"><span class="label">管理员微信：</span><input type="text" id="contactWechat" style="width:200px;"></div>
                <div class="flex-row"><span class="label">其他说明：</span><input type="text" id="contactExtra" style="width:300px;"></div>
                <button onclick="saveContact()">💾 保存联系方式</button>
            </div>
        </div>

        <!-- 价目表设置 -->
        <div class="card">
            <h2 onclick="togglePricing()">💎 算力价目表设置（点击展开/折叠）</h2>
            <div id="pricingPanel" style="display:none;">
                <div id="pricingItemsContainer"></div>
                <button onclick="addPricingRow()">+ 添加一行</button>
                <div class="flex-row" style="margin-top:10px;"><span class="label">备注说明：</span><input type="text" id="pricingNoteInput" style="width:300px;"></div>
                <button onclick="savePricing()">💾 保存价目表</button>
            </div>
        </div>

        <!-- 使用统计 -->
        <div class="card">
            <h2>📊 商家使用统计</h2>
            <div class="flex-row">
                <span class="label">选择商家：</span>
                <select id="statMerchantSelect"><option value="">-- 请选择 --</option></select>
                <span class="label">开始：</span><input type="date" id="statStart">
                <span class="label">结束：</span><input type="date" id="statEnd">
                <button onclick="queryStats()">查询</button>
            </div>
            <div id="statResult" class="stat-box">请选择商家和日期范围</div>
        </div>

        <!-- 最近记录 -->
        <div class="card">
            <h2>📋 最近使用记录 <button onclick="loadRecords()" style="float:right;">🔄 刷新</button></h2>
            <table id="recordsTable"><thead><tr><th>时间</th><th>IP</th><th>商家</th><th>风格</th><th>补充</th></tr></thead><tbody></tbody></table>
        </div>
    </div>

    <!-- 商家详情弹窗 -->
    <div id="merchantDetailModal" class="modal-overlay">
        <div class="modal-content">
            <h3>商家详情 - <span id="detailMerchantId"></span></h3>
            <div id="detailSettings"></div>
            <div style="margin-top:15px;"><strong>密码：</strong> <span id="detailPassword"></span> <button onclick="copyPassword()">📋 复制</button></div>
            <div style="margin-top:15px;">
                <input type="password" id="newMerchantPassword" placeholder="新密码（留空不修改）">
                <button onclick="changeMerchantPassword()">🔑 修改密码</button>
                <button onclick="loginAsMerchant()" class="success">🚀 直接登录商家后台</button>
            </div>
            <button onclick="document.getElementById('merchantDetailModal').style.display='none'" style="background:#ccc;color:#333;">关闭</button>
        </div>
    </div>

    <!-- 流水弹窗 -->
    <div id="flowModal" class="modal-overlay">
        <div class="modal-content" style="max-width:600px;">
            <h3>🧮 算力流水 <span id="flowMerchantName"></span></h3>
            <table><thead><tr><th>时间</th><th>类型</th><th>变动</th><th>变动后</th><th>备注</th></tr></thead><tbody id="flowTableBody"></tbody></table>
            <button onclick="document.getElementById('flowModal').style.display='none'" style="background:#ccc;color:#333;">关闭</button>
        </div>
    </div>

    <!-- 充值/扣除弹窗 -->
    <div id="rechargeModal" class="modal-overlay">
        <div class="modal-content">
            <h3>💳 调整算力</h3>
            <input type="hidden" id="rechargeMerchantId">
            <select id="rechargeType"><option value="add">➕ 充值</option><option value="subtract">➖ 扣除</option></select>
            <input type="number" id="rechargeAmount" min="1" value="10">
            <input type="text" id="rechargeNote" placeholder="备注">
            <button onclick="submitRecharge()">确认</button>
            <button onclick="document.getElementById('rechargeModal').style.display='none'" style="background:#ccc;">取消</button>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'zjm1314520';
        const token = () => localStorage.getItem('admin_token');

        function login(){
            if(document.getElementById('password').value === ADMIN_PASSWORD) {
                localStorage.setItem('admin_token', ADMIN_PASSWORD);
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('mainPanel').classList.remove('hidden');
                loadAll();
            } else {
                document.getElementById('loginError').innerText = '密码错误';
            }
        }
        function logout(){ localStorage.removeItem('admin_token'); location.reload(); }

        if(token() === ADMIN_PASSWORD) {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('mainPanel').classList.remove('hidden');
            loadAll();
        }

        async function loadAll() {
            await loadMerchants();
            await loadRecords();
            await loadContact();
            await loadPricing();
        }

        function toggleContact(){ document.getElementById('contactPanel').style.display = document.getElementById('contactPanel').style.display === 'none' ? '' : 'none'; }
        function togglePricing(){ document.getElementById('pricingPanel').style.display = document.getElementById('pricingPanel').style.display === 'none' ? '' : 'none'; }

        // ---------- 商家管理 ----------
        let currentDetailId = null;
        async function loadMerchants(){
            const res = await fetch('/api/admin/merchants', { headers: { 'x-admin-token': token() } });
            const data = await res.json();
            const tbody = document.querySelector('#merchantTable tbody');
            tbody.innerHTML = '';
            const statSelect = document.getElementById('statMerchantSelect');
            statSelect.innerHTML = '<option value="">-- 选择商家 --</option>';
            data.merchants.forEach(m => {
                const statusText = m.status === 'banned' ? '🚫已封' : '✅正常';
                tbody.innerHTML += `<tr>
                    <td>${m.id}</td><td>${m.name||''}</td><td>${m.balance}</td><td>${statusText}</td>
                    <td>
                        <button onclick="openRecharge('${m.id}')">💳 充/扣</button>
                        <button onclick="showFlow('${m.id}')">📈流水</button>
                        <button onclick="showDetail('${m.id}')" class="info">🔍详情</button>
                        <button onclick="deleteMerchant('${m.id}')" class="danger">🗑删除</button>
                        ${m.status === 'banned' ? `<button onclick="toggleBan('${m.id}',false)" class="success">🔓解封</button>` : `<button onclick="toggleBan('${m.id}',true)" class="warning">🚫封号</button>`}
                    </td></tr>`;
                statSelect.innerHTML += `<option value="${m.id}">${m.id} - ${m.name||''}</option>`;
            });
        }

        async function addMerchant(){
            const id = document.getElementById('newMerchantId').value.trim();
            const name = document.getElementById('newMerchantName').value.trim();
            const password = document.getElementById('newMerchantPass').value;
            const balance = parseInt(document.getElementById('newMerchantBalance').value)||100;
            if(!id||!password) return alert('ID和密码必填');
            await fetch('/api/admin/merchants', { method:'POST', headers:{'Content-Type':'application/json','x-admin-token':token()}, body:JSON.stringify({id,name,password,balance}) });
            await loadMerchants();
        }

        async function showDetail(id){
            currentDetailId = id;
            document.getElementById('detailMerchantId').innerText = id;
            const res = await fetch(`/api/admin/merchants?action=detail&id=${id}`, { headers:{'x-admin-token':token()} });
            const data = await res.json();
            if(res.ok){
                document.getElementById('detailPassword').innerText = data.password;
                const s = data.settings || {};
                document.getElementById('detailSettings').innerHTML = `<p><b>行业：</b>${s.industry||'未设置'}</p><p><b>关键词：</b>${s.keywords||'未设置'}</p><p><b>产品：</b>${s.product||'未设置'}</p><p><b>补充说明：</b>${s.extraNote||'未设置'}</p><p><b>快捷风格：</b>${(s.styles||[]).join(', ')||'默认'}</p>`;
                document.getElementById('newMerchantPassword').value = '';
            } else {
                alert('获取详情失败');
            }
            document.getElementById('merchantDetailModal').style.display = 'flex';
        }

        async function changeMerchantPassword(){
            const newPass = document.getElementById('newMerchantPassword').value.trim();
            if(!newPass) return alert('请输入新密码');
            await fetch('/api/admin/merchants', { method:'PUT', headers:{'Content-Type':'application/json','x-admin-token':token()}, body:JSON.stringify({id:currentDetailId, password:newPass}) });
            alert('密码已修改');
            showDetail(currentDetailId);
        }

        async function loginAsMerchant(){
            const res = await fetch('/api/admin/login-as-merchant', { method:'POST', headers:{'Content-Type':'application/json','x-admin-token':token()}, body:JSON.stringify({id:currentDetailId}) });
            const data = await res.json();
            if(data.url) window.open(data.url, '_blank');
            else alert('生成链接失败');
        }

        function copyPassword(){
            const pass = document.getElementById('detailPassword').innerText;
            navigator.clipboard.writeText(pass).then(()=>alert('密码已复制'));
        }

        // 其他辅助函数（recharge, flow, stats, records, contact, pricing）请从之前完整版 admin.html 复制，此处省略以节省篇幅，但实际文件需包含它们
        // 注：由于之前已有完整 admin.html，请将对应函数补全，或使用之前提供的完整 admin.html 再将商家详情部分合并进去。
    </script>
</body>
</html>
